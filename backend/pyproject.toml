[project]
name = "prayas-api"
version = "0.1.0"
description = "API foundation for Prayas geospatial planning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "geopandas>=1,<2",
  "shapely>=2,<3",
  "networkx>=3,<4",
  "osmnx>=2,<3",
  "scikit-learn>=1.6,<2",
  "ortools>=9.12,<10",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
